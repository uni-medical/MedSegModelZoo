<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedSeg ModelZoo</title>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    /* 重置基础样式 */
    :root {
      --primary: #0A6EFF;  /* 医疗蓝 */
      --primary-light: #E8F1FF;
      --surface: #ffffff;
      --background: #F7FAFC;  /* 更柔和的背景色 */
      --border: #E2E8F0;
      --text-primary: #1A202C;
      --text-secondary: #4A5568;
      --success: #38A169;  /* 用于指标数据 */
      --warning: #DD6B20;  /* 用于警告信息 */
      
      /* 柔和的阴影 */
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.07);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      transition: background-color 0.2s ease,
                  border-color 0.2s ease,
                  box-shadow 0.2s ease,
                  transform 0.2s ease;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: var(--text-primary);
      background: var(--background);
      line-height: 1.5;
      scroll-behavior: smooth;
    }

    /* 顶部导航 */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
    }

    .header-content {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 16px;
      height: 60px;
      display: flex;
      align-items: center;
    }

    .header-left {
      display: flex;
      align-items: center;
    }

    .logo {
      font-weight: 600;
      font-size: 20px;
      color: var(--text-primary);
      text-decoration: none;
      margin-right: 24px;
    }

    .header-search {
      width: 300px;
      margin-right: auto;
    }

    .main-nav {
      display: flex;
      gap: 4px;
      margin-left: auto;
    }

    .nav-item {
      padding: 8px 12px;
      color: var(--text-secondary);
      text-decoration: none;
      border-radius: 6px;
      font-size: 14px;
    }

    .nav-item:hover {
      background: var(--background);
    }

    .nav-item.active {
      color: var(--text-primary);
      font-weight: 500;
    }

    /* 子导航栏 */
    .subnav {
      position: fixed;
      top: 60px;
      left: 0;
      right: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 90;
    }

    .subnav-content {
      max-width: 1280px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .subnav-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .models-count {
      font-size: 20px;
      font-weight: 600;
    }

    .filter-box {
      position: relative;
    }

    .filter-box input {
      width: 300px;
      padding: 6px 12px 6px 32px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
    }

    .filter-box i {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
    }

    /* 主要内容区域 */
    .main-content {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 0;
      max-width: 1280px;
      margin: 0 auto;
      margin-top: 60px;
      height: calc(100vh - 60px);
    }

    /* 左侧导航 */
    .sidebar {
      width: 320px;
      background: white;
      border-right: 1px solid #e5e7eb;
    }

    /* 搜索框 */
    .search-box {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      height: 36px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      transition: all 0.2s ease;
    }

    .search-box i {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .search-box input {
      border: none;
      outline: none;
      width: 100%;
      height: 100%;
      font-size: 14px;
      background: transparent;
      color: var(--text-primary);
    }

    .search-box input::placeholder {
      color: var(--text-secondary);
    }

    /* 搜索框悬停和聚焦状态 */
    .search-box:hover {
      border-color: var(--primary);
    }

    .search-box:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(10, 110, 255, 0.15);
    }

    /* 调整左侧导航中搜索框的间距 */
    .nav-section .search-box {
      margin: 16px;
    }

    /* 调整右侧头部搜索框的宽度 */
    .models-header .search-box {
      width: 280px;
    }

    /* 分类部分 */
    .category-section {
      margin-bottom: 24px;
    }

    .category-title {
      font-size: 16px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 8px;
    }

    .category-items {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .category-item {
      display: flex;
      align-items: center;
      padding: 6px 8px;
      text-decoration: none;
      border-radius: 6px;
      color: #374151;
      font-size: 14px;
      transition: background-color 0.2s;
    }

    .category-item:hover {
      background-color: #f3f4f6;
    }

    .category-item.active {
      background-color: #f3f4f6;
      color: #2563eb;
    }

    .item-icon {
      width: 20px;
      margin-right: 12px;
      opacity: 0.7;
    }

    .item-text {
      flex: 1;
    }

    .item-count {
      color: #6b7280;
      font-size: 13px;
    }

    /* 搜索框聚焦状态 */
    .search-box input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
    }

    /* 右侧内容区域 */
    .content {
      padding: 0 24px;
      background: white;
    }

    .content-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .models-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .models-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .header-actions {
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 300px;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
    }

    .sort-select {
      height: 36px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      color: var(--text-secondary);
      background: var(--surface);
      cursor: pointer;
    }

    .sort-select:hover {
      border-color: var(--primary);
    }

    .models-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
      padding: 16px 0;
    }

    /* 模型卡片 */
    .model-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      background: var(--surface);
      transition: all 0.2s ease;
    }

    .model-card:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
      border-color: var(--primary);
    }

    .model-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .model-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .model-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.2;
      letter-spacing: -0.01em;  /* 提高可读性 */
    }

    .model-modality {
      font-size: 13px;
      color: var(--primary);
      background: var(--primary-light);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
      letter-spacing: 0.02em;  /* 增加字母间距提高可读性 */
    }

    .model-tags-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
    }

    .model-tags {
      display: flex;
      gap: 4px;
      overflow: hidden;
      max-width: calc(100% - 120px);
    }

    .tag {
      font-size: 13px;
      color: var(--text-secondary);
      background: var(--background);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
    }

    .model-actions {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    .action-stat {
      font-size: 13px;
      color: var(--text-secondary);
      padding: 2px 6px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .action-stat i {
      font-size: 14px;
    }

    .action-stat:hover {
      background: var(--background);
      color: var(--primary);
    }

    /* 修改右侧内容区域的样式 */
    .content {
      min-width: 0;
      padding-top: 0;
    }

    .models-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
      padding: 16px 0;
    }

    /* 修改子导航栏样式 */
    .subnav-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-text {
      padding: 6px 12px;
      border: none;
      background: none;
      color: var(--text-secondary);
      font-size: 14px;
      cursor: pointer;
    }

    .sort-dropdown select {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      color: var(--text-secondary);
      background: var(--surface);
    }

    /* 导航菜单 */
    .nav-menu {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    /* 导航组 */
    .nav-group {
      display: flex;
      flex-direction: column;
    }

    /* 主导航链接 */
    .nav-link {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
    }

    .nav-link:hover {
      color: var(--text-primary);
    }

    .nav-link.active {
      background: #000;
      color: #fff;
    }

    /* 子项目容器 */
    .nav-items {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-left: 12px;
      margin-top: 4px;
    }

    /* 子项目 */
    .nav-item {
      display: flex;
      align-items: center;
      padding: 6px 12px;
      text-decoration: none;
      color: #374151;
      font-size: 14px;
      border-radius: 6px;
    }

    .nav-item:hover {
      background: #f3f4f6;
    }

    .nav-item i {
      width: 16px;
      margin-right: 8px;
      opacity: 0.7;
    }

    .nav-item .count {
      margin-left: auto;
      color: #6b7280;
      font-size: 13px;
    }

    /* 活跃状态 */
    .nav-item.active {
      background: #f3f4f6;
      color: #2563eb;
    }

    /* 主导航标签统一样式 */
    .main-nav-tabs {
      display: flex;
      border-bottom: 1px solid #e5e7eb;
      height: 41px;
      padding: 0 24px;
      margin: 0 -24px;
      align-items: center;
      justify-content: center;
    }

    /* 左侧导航标签样式 */
    .nav-tab {
      padding: 8px 16px;
      color: var(--text-secondary);
      font-size: 14px;
      text-decoration: none;
      position: relative;
      display: flex;
      align-items: center;
      font-weight: normal;
      min-width: 80px;
      justify-content: center;
    }

    /* 右侧导航标题样式 */
    .nav-title {
      padding: 8px 16px;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: normal;
      margin: 0;
      display: flex;
      align-items: center;
    }

    /* 激活状态统一样式 */
    .nav-tab.active {
      color: var(--text-primary);
      font-weight: 500;
    }

    .nav-tab.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--text-primary);
      border-radius: 2px;
    }

    /* 调整内容区域布局 */
    .content {
      padding: 0 24px;
      background: white;
    }

    /* 调整搜索框容器样式 */
    .models-header {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* 调整子导航区域上边距 */
    .nav-section {
      padding-top: 16px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      color: #6b7280;
      margin: 24px 0 12px;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 8px;
    }

    .task-item {
      padding: 8px 12px;
      border-radius: 6px;
      color: var(--text-secondary);
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .task-item:hover {
      background: var(--background);
    }

    .task-item.active {
      background: var(--primary-light);
      color: var(--primary);
    }

    .task-item i {
      color: var(--text-secondary);
      transition: color 0.15s ease;
    }

    .task-item.active i {
      color: var(--primary);
    }

    /* 搜索框样式 */
    .content-header .search-box {
      width: 300px;
      margin-bottom: 0;
      border-radius: 6px;
    }

    .content-header .search-box input {
      padding: 6px 8px;
    }

    .models-label {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .models-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .title-group {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    /* 导航标题样式 */
    .nav-title {
      font-size: 14px;
      font-weight: normal;
      color: #6b7280;
      margin: 0;
      padding: 8px 16px;
      display: flex;
      align-items: center;
    }

    /* 调整搜索框位置 */
    .models-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 导航标签样式优化 */
    .nav-tab {
      padding: 10px 16px;
      color: var(--text-secondary);
      font-weight: 500;
      position: relative;
    }

    .nav-tab.active {
      color: var(--primary);
    }

    .nav-tab.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--primary);
      border-radius: 2px;
    }

    /* 优化排序下拉框 */
    .sort-select {
      height: 36px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      color: var(--text-secondary);
      background: var(--surface);
      cursor: pointer;
    }

    /* 性能指标显示 */
    .performance-stat {
      color: var(--success);
      font-weight: 500;
      font-size: 13px;
    }

    /* 图标样式统一 */
    .bi {
      font-size: 16px;
      color: var(--text-secondary);
    }
  </style>
</head>

<body>
  <!-- 顶部导航栏 -->
  <header class="header">
    <div class="header-content">
      <div class="header-left">
        <a href="#" class="logo">MedSeg</a>
        <div class="header-search">
          <div class="search-box">
            <i class="bi bi-search"></i>
            <input type="text" placeholder="Search models, datasets, users...">
          </div>
        </div>
      </div>
      <nav class="main-nav">
        <a href="#" class="nav-item active">Models</a>
        <a href="#" class="nav-item">Datasets</a>
        <a href="#" class="nav-item">Docs</a>
      </nav>
    </div>
  </header>

  <!-- 主要内容区域 -->
  <div class="main-content">
    <!-- 左侧导航 -->
    <aside class="sidebar">
      <!-- 主导航 -->
      <div class="main-nav-tabs">
        <a href="#" class="nav-tab active" data-target="tasks">Tasks</a>
        <a href="#" class="nav-tab" data-target="target">Target</a>
        <a href="#" class="nav-tab" data-target="modality">Modality</a>
      </div>

      <!-- 子导航区域 -->
      <div class="sub-navigation">
        <!-- Tasks分类 -->
        <div class="nav-section" id="tasks-section" style="display: block;">
          <!-- Tasks搜索框 -->
          <div class="search-box">
            <i class="bi bi-search"></i>
            <input type="text" placeholder="Filter Tasks by name" data-filter="tasks">
          </div>
          <div class="task-list">
            <a href="#" class="task-item active">
              <i class="bi bi-grid"></i>
              <span>All</span>
            </a>
            <a href="#" class="task-item">
              <i class="bi bi-circle"></i>
              <span>Segmentation</span>
              <span class="count">(45)</span>
            </a>
            <a href="#" class="task-item">
              <i class="bi bi-bounding-box"></i>
              <span>Detection</span>
              <span class="count">(23)</span>
            </a>
          </div>
        </div>

        <!-- Target分类 -->
        <div class="nav-section" id="target-section" style="display: none;">
          <!-- Target搜索框 -->
          <div class="search-box">
            <i class="bi bi-search"></i>
            <input type="text" placeholder="Filter Target by name" data-filter="target">
          </div>
          <div class="task-list">
            <a href="#" class="task-item">
              <i class="bi bi-brain"></i>
              <span>Brain</span>
              <span class="count">(15)</span>
            </a>
            <a href="#" class="task-item">
              <i class="bi bi-heart"></i>
              <span>Heart</span>
              <span class="count">(12)</span>
            </a>
            <a href="#" class="task-item">
              <i class="bi bi-lungs"></i>
              <span>Lung</span>
              <span class="count">(8)</span>
            </a>
            <a href="#" class="task-item">
              <i class="bi bi-droplet"></i>
              <span>Liver</span>
              <span class="count">(6)</span>
            </a>
          </div>
        </div>

        <!-- Modality分类 -->
        <div class="nav-section" id="modality-section" style="display: none;">
          <!-- Modality搜索框 -->
          <div class="search-box">
            <i class="bi bi-search"></i>
            <input type="text" placeholder="Filter Modality by name" data-filter="modality">
          </div>
          <div class="task-list">
            <a href="#" class="task-item">
              <i class="bi bi-image"></i>
              <span>CT</span>
              <span class="count">(32)</span>
            </a>
            <a href="#" class="task-item">
              <i class="bi bi-image"></i>
              <span>MRI</span>
              <span class="count">(28)</span>
            </a>
          </div>
        </div>
      </div>
    </aside>

    <!-- 右侧内容区域 -->
    <main class="content">
      <!-- 头部 -->
      <div class="content-header">
        <div class="models-header">
          <h1 class="nav-title">Models</h1>
          <div class="search-box">
            <i class="bi bi-search"></i>
            <input type="text" placeholder="Filter by name">
          </div>
        </div>
        <div class="header-actions">
          <select class="sort-select">
            <option>Sort: Trending</option>
            <option>Sort: Most Downloads</option>
            <option>Sort: Recently Added</option>
          </select>
        </div>
      </div>

      <!-- 模型卡片网格 -->
      <div class="models-grid">
        <!-- 模型卡片将通过JavaScript动态生成 -->
      </div>
    </main>
  </div>

  <script>
    // 加载模型数据
    async function loadModels() {
      try {
        const response = await fetch('STU_Benchmark_Information.json');
        const data = await response.json();
        renderModelCards(data);
        updateFilterCounts(data);
      } catch (error) {
        console.error('Error loading models:', error);
      }
    }

    // 更新筛选器计数
    function updateFilterCounts(models) {
      // 统计各类数量
      const counts = {
        modalities: {},
        organs: new Set(),
        frameworks: {}
      };

      models.forEach(model => {
        // 统计模态
        model.Modality.split(',').forEach(m => {
          counts.modalities[m] = (counts.modalities[m] || 0) + 1;
        });

        // 统计框架
        counts.frameworks[model.Framework] = (counts.frameworks[model.Framework] || 0) + 1;

        // 统计器官
        try {
          const categories = JSON.parse(model["Category-CN"].replace(/'/g, '"'));
          Object.values(categories).forEach(cat => {
            if (cat !== '背景') counts.organs.add(cat);
          });
        } catch (e) {}
      });

      // 更新筛选器显示
      updateModalityFilters(counts.modalities);
      updateOrganFilters(Array.from(counts.organs));
      updateFrameworkFilters(counts.frameworks);
    }

    // 渲染模型卡片
    function renderModelCards(models) {
      const container = document.querySelector('.models-grid');
      if (!container) {
        console.error('Models grid container not found');
              return;
      }

      container.innerHTML = models.map(model => {
        // 解析类别
        let categories = {};
        try {
          categories = JSON.parse(model["Category-EN"].replace(/'/g, '"'));
        } catch (e) {
          console.error('Error parsing categories:', e);
          categories = {};
        }

        // 获取除background外的所有类别
        const allCategories = Object.values(categories).filter(cat => cat !== 'background');
        // 只显示前两个类别，如果有更多则显示省略号
        const displayCategories = allCategories.slice(0, 2);
        const hasMore = allCategories.length > 2;
        
        const tags = displayCategories
          .map(cat => `<span class="tag">${cat}</span>`)
          .join('') + 
          (hasMore ? `<span class="tag">...</span>` : '');

        return `
          <div class="model-card">
            <div class="model-info">
              <div class="model-header">
                <h3 class="model-name">${model.Dataset.replace('Task', '')}</h3>
                <span class="model-modality">${model.Modality.split(',')[0]}</span>
              </div>
              <div class="model-tags-row">
                <div class="model-tags">
                  ${tags}
                </div>
                <div class="model-actions">
                  <span class="action-stat">
                    <i class="bi bi-download"></i>
                    <span>2.5k</span>
                  </span>
                  <span class="action-stat">
                    <i class="bi bi-heart"></i>
                    <span>128</span>
                  </span>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      // 更新模型计数
      const countElement = document.querySelector('.models-title');
      if (countElement) {
        countElement.textContent = models.length;
      }
    }

    // 筛选功能
    function filterModels(models, filters) {
      return models.filter(model => {
        // Modality filter
        if (filters.modalities.length > 0) {
          const modelModalities = model.Modality.split(',');
          if (!filters.modalities.some(m => modelModalities.some(mm => mm.includes(m)))) {
            return false;
          }
        }

        // Anatomy filter
        if (filters.organs.length > 0) {
          try {
            const categories = JSON.parse(model["Category-EN"].replace(/'/g, '"'));
            if (!Object.values(categories).some(cat => 
              filters.organs.some(organ => cat.toLowerCase().includes(organ))
            )) {
              return false;
            }
          } catch (e) {
            return false;
          }
        }

        // Framework filter
        if (filters.frameworks.length > 0 && !filters.frameworks.includes(model.Framework)) {
          return false;
        }

        return true;
      });
    }

    // 搜索过滤功能
    function setupSearch() {
      const searchInputs = document.querySelectorAll('.search-box input');
      
      searchInputs.forEach(input => {
        input.addEventListener('input', (e) => {
          const filterType = e.target.dataset.filter;
          const searchValue = e.target.value.toLowerCase();
          const section = document.getElementById(`${filterType}-section`);
          const items = section.querySelectorAll('.task-item');
          
          items.forEach(item => {
            const text = item.querySelector('span').textContent.toLowerCase();
            if (text.includes(searchValue) || searchValue === '') {
              item.style.display = 'flex';
            } else {
              item.style.display = 'none';
            }
          });
        });
      });
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', () => {
      loadModels();

      // 筛选器事件监听
      const filterCheckboxes = document.querySelectorAll('.filter-option input');
      filterCheckboxes.forEach(checkbox => {
        checkbox.addEventListener('change', async () => {
          const response = await fetch('STU_Benchmark_Information.json');
          const data = await response.json();
          
          // 获取当前选中的筛选条件
          const filters = {
            modalities: Array.from(document.querySelectorAll('input[name="modality"]:checked')).map(cb => cb.value),
            organs: Array.from(document.querySelectorAll('input[name="organ"]:checked')).map(cb => cb.value),
            frameworks: Array.from(document.querySelectorAll('input[name="framework"]:checked')).map(cb => cb.value)
          };

          const filteredModels = filterModels(data, filters);
          renderModelCards(filteredModels);
        });
      });

      // 排序功能
      const sortSelect = document.querySelector('.sort-select');
      sortSelect.addEventListener('change', async () => {
        const response = await fetch('STU_Benchmark_Information.json');
        const data = await response.json();
        
        const sortValue = sortSelect.value;
        let sortedModels = [...data];

        switch (sortValue) {
          case 'performance':
            sortedModels.sort((a, b) => parseFloat(b["Dice nnunet"]) - parseFloat(a["Dice nnunet"]));
            break;
          case 'newest':
            // 如果有日期字段可以添加日期排序
            break;
          // 可以添加其他排序方式
        }

        renderModelCards(sortedModels);
      });

      // 导航切换功能
      const navTabs = document.querySelectorAll('.nav-tab');
      const sections = document.querySelectorAll('.nav-section');

      navTabs.forEach(tab => {
        tab.addEventListener('click', (e) => {
          e.preventDefault();
          
          // 移除所有active类
          navTabs.forEach(t => t.classList.remove('active'));
          sections.forEach(s => s.style.display = 'none');
          
          // 添加active类到当前tab
          tab.classList.add('active');
          
          // 显示对应的section
          const targetId = `${tab.dataset.target}-section`;
          document.getElementById(targetId).style.display = 'block';
        });
      });

      setupSearch();
    });

    // 折叠面板交互
    document.querySelectorAll('.accordion-header').forEach(header => {
      header.addEventListener('click', () => {
        const accordion = header.parentElement;
        accordion.classList.toggle('active');
      });
    });

    // 筛选条件更新
    function updateFilters() {
      const selectedFilters = [];
      document.querySelectorAll('.filter-option input:checked').forEach(input => {
        const text = input.closest('.filter-option').querySelector('.option-text').textContent;
        selectedFilters.push(text);
      });
      
      // 更新已选筛选条件
      const activeFilters = document.querySelector('.active-filters');
      activeFilters.innerHTML = selectedFilters.map(filter => `
        <div class="filter-chip">
          ${filter} <i class="bi bi-x" onclick="removeFilter(this)"></i>
        </div>
      `).join('') + `
        <button class="clear-filters" onclick="clearFilters()">Clear all filters</button>
      `;
      
      // 更新选中数量
      document.querySelectorAll('.filter-accordion').forEach(accordion => {
        const checkedCount = accordion.querySelectorAll('input:checked').length;
        const countEl = accordion.querySelector('.selected-count');
        if (countEl) {
          countEl.textContent = checkedCount ? `${checkedCount} selected` : '';
        }
      });
    }

    // 移除单个筛选条件
    function removeFilter(el) {
      const filterText = el.parentElement.textContent.trim();
      document.querySelectorAll('.filter-option').forEach(option => {
        if (option.querySelector('.option-text').textContent === filterText) {
          option.querySelector('input').checked = false;
        }
      });
      updateFilters();
    }

    // 清除所有筛选条件
    function clearFilters() {
      document.querySelectorAll('.filter-option input').forEach(input => {
        input.checked = false;
      });
      updateFilters();
    }

    // 监听筛选条件变化
    document.querySelectorAll('.filter-option input').forEach(input => {
      input.addEventListener('change', updateFilters);
    });
  </script>
</body>
</html>
